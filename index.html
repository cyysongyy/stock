<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>台股投資 Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111318;--card:#1c1f2b;--card2:#252836;--card3:#2d3145;
  --green:#00d68f;--red:#ff4757;--amber:#f5a623;--blue:#4d9eff;--purple:#a78bfa;
  --text:#f0f2f8;--sub:#7a86a0;--border:#2a2f45;
  --green-dim:#00d68f22;--red-dim:#ff475722;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:480px;margin:0 auto}

/* Setup */
#setup-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px}
.setup-box{background:var(--card);border-radius:20px;padding:32px 22px;width:100%;border:1px solid var(--border);text-align:center}
.setup-logo{font-size:52px;margin-bottom:12px}
.setup-box h1{font-size:22px;font-weight:800;margin-bottom:6px}
.setup-box p{font-size:12px;color:var(--sub);margin-bottom:24px;line-height:1.7}
.setup-box input{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:12px;padding:13px;color:var(--text);font-size:16px;outline:none;margin-bottom:12px;text-align:center}
.setup-box input:focus{border-color:var(--blue)}
.setup-btn{width:100%;background:var(--blue);border:none;border-radius:12px;padding:14px;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.setup-note{font-size:10px;color:var(--sub);margin-top:14px;line-height:1.6}

/* Top bar */
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:0 14px;display:flex;align-items:center;gap:8px;height:50px;position:sticky;top:0;z-index:100}
.user-badge{display:flex;align-items:center;gap:7px;cursor:pointer}
.user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
.user-name{font-size:13px;font-weight:600;max-width:65px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-title{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--blue)}
.monitor-pill{display:flex;align-items:center;gap:5px;border-radius:20px;padding:5px 11px;cursor:pointer;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--card2)}
.monitor-pill.on{background:var(--green-dim);border-color:var(--green)44;color:var(--green)}
.monitor-pill.off{color:var(--sub)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.2s ease-in-out infinite}
.pulse.off{background:var(--sub);animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}

/* User menu */
.user-menu{display:none;position:fixed;top:56px;left:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px;z-index:150;min-width:165px;box-shadow:0 8px 32px #0003}
.user-menu.open{display:block}
.menu-item{padding:9px 11px;border-radius:7px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:7px}
.menu-item:hover{background:var(--card2)}
.menu-sep{height:1px;background:var(--border);margin:3px 0}
.menu-danger{color:var(--red)}

/* Monitor panel */
.monitor-panel{background:var(--card2);border-bottom:1px solid var(--border);padding:10px 14px;display:none}
.monitor-panel.open{display:block}
.mp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.mp-label{font-size:11px;color:var(--sub)}
.mp-select{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-size:11px;outline:none}
.mp-countdown{font-size:11px;color:var(--blue);font-weight:600;margin-left:auto}
.mp-status{font-size:10px;padding:4px 8px;background:var(--card);border-radius:6px;border:1px solid var(--border);color:var(--sub)}
.mp-status.open{color:var(--green);border-color:var(--green)33;background:var(--green-dim)}
.mp-status.closed{color:var(--amber);border-color:var(--amber)33;background:#f5a62312}
.mp-btn{border:none;border-radius:7px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer}
.mp-btn.start{background:var(--green);color:#fff}
.mp-btn.stop{background:var(--red-dim);color:var(--red);border:1px solid var(--red)33}
.notif-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 9px;color:var(--sub);font-size:10px;cursor:pointer}
.notif-btn.ok{color:var(--green);border-color:var(--green)33;background:var(--green-dim)}
.mp-hint{font-size:9px;color:var(--sub);line-height:1.5;margin-top:4px}

/* Search */
.search-bar{padding:9px 12px;display:flex;gap:7px;background:var(--card);border-bottom:1px solid var(--border)}
.search-bar input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--blue)}
.search-bar button{background:var(--blue);border:none;border-radius:8px;padding:8px 14px;color:#fff;font-size:12px;font-weight:600;cursor:pointer}

/* Tabs */
.tab-bar{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:11px 16px;font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Sections */
.section{display:none}
.section.active{display:block}

/* ── Portfolio Overview ── */
.overview-card{background:var(--card);padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.ov-donut-row{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.donut-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
.donut-wrap canvas{position:absolute;inset:0}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center .pct{font-size:20px;font-weight:800;color:var(--text)}
.donut-center .lbl{font-size:9px;color:var(--sub);margin-top:1px}
.ov-stats{flex:1}
.ov-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--border)}
.ov-row:last-child{border-bottom:none}
.ov-label{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px}
.ov-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ov-val{font-size:14px;font-weight:700}
.ov-val.up{color:var(--red)}.ov-val.down{color:var(--green)}.ov-val.neu{color:var(--text)}
.ov-actions{display:flex;gap:7px}
.ov-btn{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 6px;font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;text-align:center}
.ov-btn.primary{background:var(--blue)18;border-color:var(--blue)44;color:var(--blue)}

/* ── Holdings Table ── */
.holdings-wrap{padding:0}
.tbl-header{display:grid;grid-template-columns:1fr 28px 80px 70px 80px;padding:8px 14px;background:var(--card2);border-bottom:1px solid var(--border)}
.tbl-header span{font-size:10px;color:var(--sub);font-weight:600;text-transform:uppercase}
.tbl-header span:not(:first-child){text-align:right}
.holding-row{display:grid;grid-template-columns:1fr 28px 80px 70px 80px;padding:12px 14px;border-bottom:1px solid var(--border)22;cursor:pointer;background:var(--card);transition:background .15s}
.holding-row:hover,.holding-row:active{background:var(--card2)}
.hr-code{font-size:13px;font-weight:700;margin-bottom:1px;letter-spacing:.3px}
.hr-sname{font-size:10px;color:var(--sub);margin-bottom:0}
.hr-type{font-size:9px;color:var(--sub)}
.hr-prices{text-align:right}
.hr-mkt{font-size:13px;font-weight:700}
.hr-avg{font-size:10px;color:var(--sub)}
.hr-shares{text-align:right}
.hr-qty{font-size:13px;font-weight:600}
.hr-tradeable{font-size:10px;color:var(--sub)}
.hr-pl{text-align:right}
.hr-pl-amt{font-size:13px;font-weight:700}
.hr-pl-pct{font-size:10px;font-weight:600}
.hr-pl-amt.up,.hr-pl-pct.up{color:var(--red)}
.hr-chg{font-size:9px;font-weight:600;margin-top:1px}.hr-chg.up{color:var(--red)}.hr-chg.down{color:var(--green)}
.hr-pl-amt.down,.hr-pl-pct.down{color:var(--green)}

/* Holding detail panel */
.detail-panel{background:var(--card2);border-bottom:2px solid var(--border);padding:12px 14px;display:none}
.detail-panel.open{display:block}
.dp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.dp-item label{font-size:9px;color:var(--sub);display:block;margin-bottom:2px;text-transform:uppercase}
.dp-item span{font-size:12px;font-weight:700}

/* Traffic light */
.traffic-light{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 10px;border-radius:10px;border:1px solid}
.traffic-light.buy{background:var(--red-dim);border-color:var(--red)44}
.traffic-light.sell{background:var(--green-dim);border-color:var(--green)44}
.traffic-light.hold{background:#f5a62318;border-color:var(--amber)44}
.tl-light{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.tl-light.red{background:var(--red);box-shadow:0 0 8px var(--red)88}
.tl-light.green{background:var(--green);box-shadow:0 0 8px var(--green)88}
.tl-light.amber{background:var(--amber);box-shadow:0 0 8px var(--amber)88}
.tl-text{font-size:11px;font-weight:700}
.tl-text.buy{color:var(--red)}.tl-text.sell{color:var(--green)}.tl-text.hold{color:var(--amber)}
.tl-reason{font-size:10px;color:var(--sub);margin-left:2px}

/* Target progress */
.target-strip{margin-top:8px}
.ts-row{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-bottom:4px}
.ts-track{background:var(--border);border-radius:3px;height:5px;overflow:hidden;position:relative}
.ts-fill{height:5px;border-radius:3px}
.ts-labels{display:flex;justify-content:space-between;margin-top:3px;font-size:9px}
.dp-actions{display:flex;gap:6px}
.dp-btn{flex:1;border:none;border-radius:7px;padding:7px;font-size:11px;font-weight:600;cursor:pointer}
.dp-btn.edit{background:var(--card3);color:var(--sub)}
.dp-btn.del{background:var(--red-dim);color:var(--red)}
.dp-btn.add-target{background:var(--blue)18;color:var(--blue)}

/* Alert log */
.alert-log-wrap{padding:12px 14px}
.al-title{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.al-clear{font-size:9px;color:var(--sub);cursor:pointer;text-decoration:underline}
.al-entry{background:var(--card);border-radius:9px;padding:10px 11px;margin-bottom:6px;border-left:3px solid;display:flex;gap:8px}
.al-entry.target{border-color:var(--green)}.al-entry.stop{border-color:var(--red)}.al-entry.signal{border-color:var(--amber)}
.al-icon{font-size:16px;flex-shrink:0}
.al-body .al-code{font-size:12px;font-weight:700}
.al-body .al-msg{font-size:11px;color:var(--sub);margin-top:1px}
.al-body .al-time{font-size:9px;color:var(--sub);margin-top:2px}

/* Analysis/fundamental */
.section-inner{padding:12px 14px}
.stock-hcard{background:var(--card);border-radius:11px;padding:12px;margin-bottom:10px;border:1px solid var(--border)}
.price-big{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.price-big .price{font-size:26px;font-weight:800}
.price-big .chg{font-size:13px;font-weight:600}
.stock-sub{font-size:11px;color:var(--sub);margin-bottom:10px}
.rec-box{border-radius:8px;padding:9px 11px;margin-bottom:10px;font-size:11px;line-height:1.5}
.rec-bull{background:var(--green-dim);border:1px solid var(--green)33;color:var(--green)}
.rec-bear{background:var(--red-dim);border:1px solid var(--red)33;color:var(--red)}
.rec-neu{background:var(--card2);border:1px solid var(--border);color:var(--sub)}
.overall-signal{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:11px;margin-bottom:10px;border:1px solid var(--border)}
.os-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.os-bull{background:var(--green-dim);color:var(--green)}.os-bear{background:var(--red-dim);color:var(--red)}.os-neu{background:#8892a422;color:var(--sub)}
.os-text h3{font-size:13px;font-weight:700}.os-text p{font-size:10px;color:var(--sub);margin-top:1px}
.signal-box{background:var(--card);border-radius:10px;padding:10px 11px;margin-bottom:10px;border:1px solid var(--border)}
.signal-title{font-size:9px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.signal-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.signal-name{font-size:11px;color:var(--text)}
.signal-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px}
.bull{background:var(--green-dim);color:var(--green)}.bear{background:var(--red-dim);color:var(--red)}.neut{background:#8892a422;color:var(--sub)}
.chart-card{background:var(--card);border-radius:11px;padding:11px;margin-bottom:10px;border:1px solid var(--border)}
.chart-title{font-size:10px;color:var(--sub);font-weight:600;margin-bottom:7px}
.chart-wrap{position:relative;height:175px}
.chart-wrap.tall{height:230px}
.ma-legend{display:flex;gap:10px;margin-bottom:5px;flex-wrap:wrap}
.ma-dot{display:inline-block;width:8px;height:3px;border-radius:2px;margin-right:3px;vertical-align:middle}
.ma-label{font-size:9px;color:var(--sub)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stat-card{background:var(--card);border-radius:9px;padding:9px 7px;border:1px solid var(--border);text-align:center}
.stat-label{font-size:9px;color:var(--sub);margin-bottom:2px}
.stat-val{font-size:14px;font-weight:700}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:#000c;z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px 32px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:700;margin-bottom:14px}
.form-group{margin-bottom:9px}
.form-group label{font-size:9px;color:var(--sub);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--blue)}
.form-hint{font-size:9px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.form-hint input{width:55px;padding:2px 6px;font-size:11px;display:inline}
.form-section{font-size:9px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px;border-top:1px solid var(--border);padding-top:9px}
.modal-btns{display:flex;gap:8px;margin-top:13px}
.modal-btns button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn-cancel{background:var(--card2);color:var(--sub)}
.btn-save{background:var(--blue);color:#fff}

/* Misc */
.empty-state{text-align:center;padding:40px 16px;color:var(--sub)}
.empty-state .icon{font-size:32px;margin-bottom:8px}
.loading{text-align:center;padding:32px;color:var(--sub)}
.loading .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:var(--red-dim);border:1px solid var(--red)33;border-radius:8px;padding:10px;color:var(--red);font-size:11px;margin-bottom:9px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2a2f45;color:var(--text);padding:8px 16px;border-radius:30px;font-size:11px;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
select option{background:var(--card2);color:var(--text)}
.add-fab{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:var(--blue);border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px #0006;z-index:300}

/* OCR Import Modal */
.ocr-modal{max-width:440px;padding:18px}
.ocr-upload{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:10px}
.ocr-upload:hover{border-color:var(--blue);background:#4d9eff08}
.ocr-upload p{font-size:11px;color:var(--sub);margin-top:4px}
#ocr-img-wrap{display:none;margin-bottom:10px}
#ocr-img{width:100%;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid var(--border)}
#ocr-bar-wrap{background:var(--border);border-radius:4px;height:4px;margin-top:5px;display:none}
#ocr-bar{background:var(--blue);height:4px;border-radius:4px;width:0%;transition:.3s}
#ocr-status-msg{font-size:10px;color:var(--sub);margin-top:4px;min-height:14px}
.ocr-tbl-header{display:grid;grid-template-columns:1fr 68px 72px 24px;gap:4px;font-size:9px;color:var(--sub);text-transform:uppercase;padding:0 2px;margin-bottom:3px}
.ocr-row{display:grid;grid-template-columns:1fr 68px 72px 24px;gap:4px;margin-bottom:4px;align-items:center}
.ocr-row input{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:5px 7px;color:var(--text);font-size:11px;outline:none;width:100%}
.ocr-row input:focus{border-color:var(--blue)}
.ocr-row-del{background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px;padding:0 2px}
.ocr-row-del:hover{color:var(--red)}
.ocr-add-row{width:100%;background:none;border:1px dashed var(--border);border-radius:6px;padding:5px;color:var(--sub);font-size:11px;cursor:pointer;margin:4px 0 10px}
.ocr-add-row:hover{border-color:var(--blue);color:var(--blue)}

.tbl-header .th-sig{text-align:center;font-size:8px}
.hr-sig{display:flex;align-items:center;justify-content:center}
.sig-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer}
.sig-dot.green{background:#00c853;box-shadow:0 0 7px #00c85388}
.sig-dot.yellow{background:#ffd700;box-shadow:0 0 7px #ffd70088}
.sig-dot.red{background:#ff4757;box-shadow:0 0 7px #ff475788}
.sig-dot.grey{background:var(--border)}
/* Score Cards */
.score-section{padding:14px}
.score-section-title{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.sc-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.sc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sc-dot-big{width:18px;height:18px;border-radius:50%;flex-shrink:0}
.sc-dot-big.green{background:#00c853;box-shadow:0 0 8px #00c85366}
.sc-dot-big.yellow{background:#ffd700;box-shadow:0 0 8px #ffd70066}
.sc-dot-big.red{background:#ff4757;box-shadow:0 0 8px #ff475766}
.sc-name{font-size:14px;font-weight:700;flex:1}
.sc-score{font-size:18px;font-weight:800}
.sc-score.green{color:#00c853}.sc-score.yellow{color:#ffd700}.sc-score.red{color:#ff4757}
.sc-verdict{font-size:10px;color:var(--sub);margin-top:1px}
.sc-bars{display:flex;flex-direction:column;gap:7px}
.sc-bar-row{display:flex;align-items:center;gap:8px}
.sc-bar-label{font-size:10px;color:var(--sub);width:68px;flex-shrink:0}
.sc-bar-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.sc-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.sc-bar-pts{font-size:10px;font-weight:600;width:28px;text-align:right;flex-shrink:0}
.sc-note{font-size:9px;color:var(--sub);margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
/* Potential Stocks */
.ps-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:4px}
.ps-title{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.ps-refresh{font-size:10px;color:var(--blue);cursor:pointer;padding:3px 8px;border:1px solid var(--blue)44;border-radius:6px}
.ps-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.ps-card.hot{border-color:var(--red)66}
.ps-card-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.ps-badge{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ps-badge.high{background:var(--red)22}.ps-badge.mid{background:var(--amber)22}.ps-badge.low{background:var(--border)}
.ps-name{font-size:13px;font-weight:700;flex:1;line-height:1.3}
.ps-sub{font-size:10px;color:var(--sub);margin-top:2px}
.ps-total{text-align:right;flex-shrink:0}
.ps-total-num{font-size:20px;font-weight:800}
.ps-total-num.high{color:var(--red)}.ps-total-num.mid{color:var(--amber)}.ps-total-num.low{color:var(--sub)}
.ps-total-lbl{font-size:9px;color:var(--sub)}
.ps-factors{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ps-factor{background:var(--card);border-radius:7px;padding:7px 9px}
.ps-factor-name{font-size:9px;color:var(--sub);margin-bottom:3px}
.ps-factor-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:3px}
.ps-factor-fill{height:100%;border-radius:2px}
.ps-factor-val{font-size:10px;font-weight:700}
.ps-verdict{margin-top:9px;padding:7px 10px;border-radius:7px;font-size:10px;font-weight:600}
.ps-verdict.high{background:var(--red)15;color:var(--red)}.ps-verdict.mid{background:var(--amber)15;color:var(--amber)}.ps-verdict.low{background:var(--border);color:var(--sub)}
.ps-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.ps-tag{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--card);border:1px solid var(--border);color:var(--sub)}
.ps-tag.hot{border-color:var(--red)55;color:var(--red);background:var(--red)11}
.ps-update-time{font-size:9px;color:var(--sub);text-align:right;margin-top:4px}
/* IPO */
.ipo-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.ipo-title{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:8px}
.ipo-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)44;font-size:11px}
.ipo-row:last-child{border-bottom:none}
</style>
</head>
<body>

<!-- Setup -->
<div id="setup-screen">
  <div class="setup-box">
    <div class="setup-logo">📈</div>
    <h1>台股投資 Dashboard</h1>
    <p>建立你的專屬投資追蹤<br>自動計算損益・買賣訊號提醒</p>
    <input id="setup-name" type="text" placeholder="你的名字（如：Young）" maxlength="12"
      onkeydown="if(event.key==='Enter')finishSetup()">
    <button class="setup-btn" onclick="finishSetup()">開始使用 →</button>
    <p class="setup-note">📱 資料存在你的裝置，不同人各自獨立</p>
  </div>
</div>

<!-- App -->
<div id="app" style="display:none">

  <div class="user-menu" id="user-menu">
    <div class="menu-item" onclick="openRenameModal()">✏️ 修改名字</div>
    <div class="menu-item" onclick="exportData()">📤 匯出資料</div>
    <div class="menu-item" onclick="document.getElementById('import-file').click()">📥 匯入 JSON</div>
    <div class="menu-item" onclick="openOCRModal()">📷 圖片匯入</div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    <div class="menu-sep"></div>
    <div class="menu-item menu-danger" onclick="resetApp()">🗑️ 清除所有資料</div>
  </div>

  <div class="top-bar">
    <div class="user-badge" onclick="toggleUserMenu()">
      <div class="user-avatar" id="avatar-letter">?</div>
      <div class="user-name" id="top-username">-</div>
    </div>
    <div class="app-title">台股 Dashboard</div>
    <div class="monitor-pill off" id="monitor-pill" onclick="toggleMonitorPanel()">
      <span class="pulse off" id="pulse-dot"></span>
      <span id="pill-label">監控</span>
    </div>
  </div>

  <!-- Monitor Panel -->
  <div class="monitor-panel" id="monitor-panel">
    <div class="mp-row">
      <span class="mp-label">更新間隔</span>
      <select class="mp-select" id="interval-select"><option value="5">5分鐘</option><option value="10" selected>10分鐘</option><option value="15">15分鐘</option><option value="30">30分鐘</option><option value="60">1小時</option></select>
      <button class="notif-btn" id="notif-btn" onclick="reqNotifPerm()">🔕 通知</button>
      <span class="mp-countdown" id="mp-countdown"></span>
      <button class="mp-btn start" id="monitor-toggle-btn" onclick="toggleMonitor()">▶ 開始</button>
    </div>
    <div class="mp-row">
      <div class="mp-status" id="market-status">⏳ 判斷中</div>
    </div>
    <div class="mp-hint">台股交易時段 09:00–13:30（週一至週五）。開啟後自動更新報價，觸發目標/停損/訊號時發送通知。</div>
  </div>

  <div class="search-bar">
    <input id="inp" type="text" placeholder="搜尋股票代號（如 2330）" maxlength="6"
      onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">查詢</button>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('portfolio')">📊 庫存</div>
    <div class="tab" onclick="switchTab('alerts')">🔔 提醒</div>
    <div class="tab" onclick="switchTab('analysis')">📈 分析</div>
    <div class="tab" onclick="switchTab('fundamental')">📋 基本面</div>
  </div>

  <!-- Portfolio -->
  <div id="sec-portfolio" class="section active">
    <div id="overview-wrap"></div>
    <div id="holdings-wrap"></div>
  </div>

  <!-- Alerts -->
  <div id="sec-alerts" class="section">
    <div id="potential-stocks-wrap" style="padding:0 14px 14px"></div>
    <div class="alert-log-wrap" id="alert-log-wrap">
      <div class="empty-state"><div class="icon">🔔</div><p>尚無提醒記錄</p></div>
    </div>
  </div>

  <!-- Analysis -->
  <div id="sec-analysis" class="section">
    <div class="section-inner" id="analysis-content">
      <div class="empty-state"><div class="icon">🔍</div><p>請輸入股票代號查詢</p></div>
    </div>
  </div>

  <!-- Fundamental -->
  <div id="sec-fundamental" class="section">
    <div class="section-inner" id="fundamental-content">
      <div class="empty-state"><div class="icon">📋</div><p>請先查詢股票</p></div>
    </div>
  </div>

  <button class="add-fab" onclick="openAddModal()" title="新增持股">＋</button>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal-add" onclick="if(event.target===this)closeModal('modal-add')">
  <div class="modal">
    <h3 id="modal-add-title">新增持股</h3>
    <input type="hidden" id="m-edit-idx" value="-1">
    <div class="form-group"><label>股票代號 *</label><input id="m-code" type="text" placeholder="如 2330" maxlength="6"></div>
    <div class="form-group"><label>股票名稱</label><input id="m-name" type="text" placeholder="如 台積電"></div>
    <div class="form-group"><label>類別</label>
      <select id="m-cat"><option value="">— 選填 —</option><option>半導體</option><option>電子代工</option><option>金融</option><option>ETF</option><option>傳產</option><option>電子商務</option></select></div>
    <div class="form-group"><label>持有股數（股）*</label><input id="m-qty" type="number" placeholder="如 2000" min="1"></div>
    <div class="form-group"><label>平均成本（元/股）*</label><input id="m-cost" type="number" placeholder="如 64.94" step="0.01"></div>
    <div class="form-section">🎯 目標設定（觸發時自動提醒）</div>
    <div class="form-group"><label>目標賣出價（元）</label>
      <input id="m-target" type="number" placeholder="達到此價格時提醒" step="0.01">
      <div class="form-hint">或目標報酬率：<input id="m-target-pct" type="number" placeholder="%" step="0.1" oninput="calcTargetFromPct()">%</div></div>
    <div class="form-group"><label>停損價（元）</label>
      <input id="m-stop" type="number" placeholder="跌到此價格時警示" step="0.01">
      <div class="form-hint">或停損率：<input id="m-stop-pct" type="number" placeholder="%" step="0.1" oninput="calcStopFromPct()">%（如 -10）</div></div>
    <div class="form-group"><label>技術訊號提醒</label>
      <select id="m-signal-alert">
        <option value="">不設定</option>
        <option value="rsi_oversold">RSI 超賣（&lt;30）→ 買入機會</option>
        <option value="rsi_overbought">RSI 超買（>70）→ 考慮賣出</option>
        <option value="macd_bull">MACD 黃金交叉 → 買入訊號</option>
        <option value="macd_bear">MACD 死亡交叉 → 賣出訊號</option>
        <option value="ma_bull">突破 MA20 → 多頭訊號</option>
        <option value="ma_bear">跌破 MA20 → 注意支撐</option>
      </select></div>
    <div class="form-group"><label>備註</label><input id="m-note" type="text" placeholder="長期持有、波段操作…"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-add')">取消</button>
      <button class="btn-save" onclick="saveHolding()">儲存</button>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="modal-rename" onclick="if(event.target===this)closeModal('modal-rename')">
  <div class="modal">
    <h3>修改名字</h3>
    <div class="form-group"><label>你的名字</label><input id="rename-inp" type="text" maxlength="12" onkeydown="if(event.key==='Enter')saveRename()"></div>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal('modal-rename')">取消</button><button class="btn-save" onclick="saveRename()">儲存</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
init();
</script>
</body>
</html>
